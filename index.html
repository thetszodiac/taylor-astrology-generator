<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taylor Swift × Astrology</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    padding: 30px 15px;
    background: #f7f3f5;
    color: #332d32;
    font-family: Georgia, "Times New Roman", serif;
}
.generator {
    max-width: 650px;
    margin: auto;
}
h1 {
    text-align: center;
    font-size: 30px;
    letter-spacing: 1px;
    margin-bottom: 8px;
}
.intro {
    text-align: center;
    color: #756d73;
    font-style: italic;
    line-height: 1.6;
    margin-bottom: 35px;
}
.choices {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}
.choice label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}
select {
    width: 100%;
    padding: 11px;
    border: 1px solid #cfc5cc;
    border-radius: 7px;
    background: white;
    color: #332d32;
    font-family: Georgia, serif;
    font-size: 15px;
}
.generate {
    display: block;
    margin: 0 auto 35px;
    padding: 12px 28px;
    border: none;
    border-radius: 7px;
    background: #332d32;
    color: white;
    font-family: Georgia, serif;
    font-size: 15px;
    cursor: pointer;
}
.generate:hover {
    opacity: 0.85;
}
#results {
    display: none;
}
.result {
    background: white;
    border: 1px solid #e1d9de;
    border-radius: 9px;
    padding: 22px;
    margin-bottom: 15px;
}
.result h2 {
    margin: 0 0 15px;
    font-size: 20px;
}
.song {
    line-height: 1.8;
}
.footer {
    text-align: center;
    color: #8a8187;
    font-size: 13px;
    margin-top: 30px;
}
@media (max-width: 600px) {
    .choices {
        grid-template-columns: 1fr;
    }
    h1 {
        font-size: 25px;
    }
}
</style>
</head>
<body>

<p class="intro">
Choose your Sun, Rising and Moon signs to discover the Taylor Swift songs assigned to your Big Three.
</p>
<div class="choices">

<option>Aries</option>
<option>Taurus</option>
<option>Gemini</option>
<option>Cancer</option>
<option>Leo</option>
<option>Virgo</option>
<option>Libra</option>
<option>Scorpio</option>
<option>Sagittarius</option>
<option>Capricorn</option>
<option>Aquarius</option>
<option>Pisces</option>
</select>
</div>
<div class="choice">
<label for="rising">🌅 Rising</label>

<option>Taurus</option>
<option>Gemini</option>
<option>Cancer</option>
<option>Leo</option>
<option>Virgo</option>
<option>Libra</option>
<option>Scorpio</option>
<option>Sagittarius</option>
<option>Capricorn</option>
<option>Aquarius</option>
<option>Pisces</option>
</select>
</div>
<div class="choice">
<label for="moon">🌙 Moon</label>
<select id="moon">
<option value="">Choose a sign</option>
<option>Aries</option>
<option>Taurus</option>
<option>Gemini</option>
<option>Cancer</option>
<option>Leo</option>
<option>Virgo</option>
<option>Libra</option>
<option>Scorpio</option>
<option>Sagittarius</option>
<option>Capricorn</option>
<option>Aquarius</option>
<option>Pisces</option>
</select>
</div>
</div>
<button class="generate" onclick="generateSongs()">
Generate My Songs ✨
</button>
<div id="results">
<div class="result">
<h2 id="sunTitle"></h2>
<div class="song" id="sunSongs"></div>
</div>
<div class="result">
<h2 id="risingTitle"></h2>
<div class="song" id="risingSongs"></div>
</div>
<div class="result">
<h2 id="moonTitle"></h2>
<div class="song" id="moonSongs"></div>
</div>
</div>
<p class="footer">
Taylor Swift × Astrology
</p>
</div>

function generateSongs() {

const rising = document.getElementById("rising").value;

alert("Please choose your Sun, Rising and Moon signs.");

}

"☀️ " + sun + " Sun";
document.getElementById("risingTitle").textContent =
"🌅 " + rising + " Rising";
document.getElementById("moonTitle").textContent =
"🌙 " + moon + " Moon";

songs[sun].Sun.map(song => "• " + song).join("<br>");

songs[rising].Rising.map(song => "• " + song).join("<br>");
document.getElementById("moonSongs").innerHTML =
songs[moon].Moon.map(song => "• " + song).join("<br>");

}
